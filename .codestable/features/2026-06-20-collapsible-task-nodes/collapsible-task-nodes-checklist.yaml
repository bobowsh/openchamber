    source: 编排骨架
    status: passed

  - item: "TaskToolSummary 内部条目截断逻辑不变（6 条可见 + +N more）"
    source: 范围守护
    status: passed

  - item: "TaskToolSummary 内部 output 独立折叠不变"
    source: 范围守护
    status: passed

  - item: "无 isTaskTool 跳过折叠动画的代码残留"
    source: 范围守护
